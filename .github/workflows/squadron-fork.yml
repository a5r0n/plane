name: Squadron fork

on:
  pull_request:
    branches: [squadron]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    name: Hook log
    if: ${{ !github.event.pull_request.draft }} # drafts spend no CI; marking ready runs it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check every hook is logged
        run: fork/check-hooks.sh
