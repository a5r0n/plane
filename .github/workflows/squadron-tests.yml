name: Squadron tests

on:
  pull_request:
    branches: [squadron]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    if: ${{ !github.event.pull_request.draft }} # drafts spend no CI; marking ready runs it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Create env file
        run: |
          cp apps/api/.env.example apps/api/.env
          # Tests share one API key, so the default limit fails them by timing (see FORK.md).
          echo 'API_KEY_RATE_LIMIT="100000/minute"' >> apps/api/.env
      - name: Run tests
        run: docker compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from api-tests
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  migrations:
    name: Migrations
    if: ${{ !github.event.pull_request.draft }} # drafts spend no CI; marking ready runs it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Create env file
        run: cp apps/api/.env.example apps/api/.env
      # Fork migrations must apply, undo and re-apply; no model change may lack a migration (FORK.md).
      - name: Check migrations
        run: >-
          docker compose -f docker-compose-test.yml run --rm --build api-tests sh -c '
          set -e;
          python manage.py migrate --no-input;
          python manage.py makemigrations --check --dry-run db squadron_ext;
          python manage.py migrate squadron_ext zero --no-input;
          python manage.py migrate squadron_ext --no-input'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
